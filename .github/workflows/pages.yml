name: 官网部署到 GitHub Pages

# 只有 site/ 变了才重新部署。
#
# 这个仓库里 app/ 是 Rust + Tauri 桌面应用，跟官网完全无关 ——
# 改一行 DSP 就重跑一次前端构建纯属浪费额度。
#
# `workflow_dispatch` 是发版流程用的：Release 发出去之后由 release.yml
# 派发一次，把新的版本号与下载链接烤进 HTML（官网是零 JS 的静态页）。
#
# ⚠️ 发版流程必须**派发**而不是把本文件当可复用工作流调用 ——
# 复用调用会继承 tag 的 ref，而 `github-pages` 环境只允许默认分支部署。
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署。连续推送时取消排队中的旧任务，
# 但**不打断正在进行的部署** —— 半路掐断会让站点停在中间状态。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      # 取最新 Release 的版本号与安装包信息，**烤成兜底值**。
      #
      # 线上真正生效的是页面里那个内联版本探针
      # （site/scripts/release-probe.js）：它在加载后直接问 API 要最新版。
      # 这一步烤进去的值负责三件事：首屏不闪、禁用 JS 也能下载、
      # API 限流（匿名每 IP 每小时 60 次）时不开天窗。
      #
      # 两层都要，是因为它们失败的场景不重叠：烤的那份会过期
      # （在网页上手改 Release 不触发重新部署），探针那份会请求失败。
      #
      # 还没有任何 Release 时全部留空，页面会显示「尚未发布」——
      # 而探针一旦发现线上已有版本，会把那些块放出来。
      - name: 取最新 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          json=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" 2>/dev/null || true)
          tag=""; date=""; url=""; size=""; name=""
          if [ -n "$json" ]; then
            tag=$(printf '%s' "$json" | jq -r '.tag_name // empty')
            date=$(printf '%s' "$json" | jq -r '.published_at // empty' | cut -dT -f1)

            # ⚠️ Release 里现在有**两个** exe：
            #   wego-voice_<版本>_x64.exe  ← 主程序，官网要发的就是它
            #   wego-clone.exe             ← 声线转换的伴生程序，由主程序按需下载
            #
            # 所以必须**认前缀**，不能再"取第一个 .exe" —— 那样官网的
            # 下载按钮会指向 18 MB 的推理程序，而用户点下去拿到的东西打不开。
            # 仍然排掉 -setup.exe：老版本里还留着安装包。
            a=$(printf '%s' "$json" | jq -c               '[.assets[]? | select(.name | startswith("wego-voice_")) | select(.name | endswith(".exe")) | select(.name | endswith("-setup.exe") | not)][0] // empty')
            if [ -n "$a" ]; then
              url=$(printf '%s'  "$a" | jq -r '.browser_download_url')
              size=$(printf '%s' "$a" | jq -r '.size')
              name=$(printf '%s' "$a" | jq -r '.name')
            fi
          fi
          {
            echo "VITE_RELEASE_TAG=$tag"
            echo "VITE_RELEASE_DATE=$date"
            echo "VITE_RELEASE_URL=$url"
            echo "VITE_RELEASE_SIZE=$size"
            echo "VITE_RELEASE_FILE=$name"
          } >> "$GITHUB_ENV"
          echo "最新 Release：${tag:-（还没有）}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # npm ci 而不是 npm install：严格按 lock 文件装，
      # 保证线上构建和本地是同一套依赖
      - run: npm ci

      # build 里串了 tsc → vite build → SSR 构建 → 预渲染。
      # 预渲染脚本会在渲染结果异常时直接抛错，
      # 所以这一步绿了就代表产物里真的有正文，不是空壳。
      - run: npm run build
        env:
          SITE_URL: https://nudc.github.io/wego-voice/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
