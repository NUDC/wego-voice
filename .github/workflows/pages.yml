name: 官网部署到 GitHub Pages

# 只有 site/ 变了才重新部署。
#
# 这个仓库里 app/ 是 Rust + Tauri 桌面应用，跟官网完全无关 ——
# 改一行 DSP 就重跑一次前端构建纯属浪费额度。
#
# `workflow_dispatch` 是发版流程用的：Release 发出去之后由 release.yml
# 派发一次，把新的版本号与下载链接烤进 HTML（官网是零 JS 的静态页）。
#
# ⚠️ 发版流程必须**派发**而不是把本文件当可复用工作流调用 ——
# 复用调用会继承 tag 的 ref，而 `github-pages` 环境只允许默认分支部署。
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署。连续推送时取消排队中的旧任务，
# 但**不打断正在进行的部署** —— 半路掐断会让站点停在中间状态。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      # 取最新 Release 的版本号与安装包信息。
      #
      # 为什么在**构建期**取而不是页面上用 JS 拉：官网刻意做成零 JavaScript
      # （见 site/src/entry-server.tsx）。为了显示一个版本号就把 React 运行时
      # 和一次网络请求加回去，不划算 —— 而发版时重新部署一次就够了。
      #
      # 还没有任何 Release 时全部留空，页面会显示「尚未发布」。
      - name: 取最新 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          json=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" 2>/dev/null || true)
          tag=""; date=""; url=""; size=""; name=""; surl=""; ssize=""
          if [ -n "$json" ]; then
            tag=$(printf '%s' "$json" | jq -r '.tag_name // empty')
            date=$(printf '%s' "$json" | jq -r '.published_at // empty' | cut -dT -f1)

            # 免安装版 = .exe 且**不**以 -setup.exe 结尾。
            # 官网主按钮给它 —— 工具类用户偏好拷了就跑。
            a=$(printf '%s' "$json" | jq -c               '[.assets[]? | select(.name | endswith(".exe")) | select(.name | endswith("-setup.exe") | not)][0] // empty')
            if [ -n "$a" ]; then
              url=$(printf '%s'  "$a" | jq -r '.browser_download_url')
              size=$(printf '%s' "$a" | jq -r '.size')
              name=$(printf '%s' "$a" | jq -r '.name')
            fi

            b=$(printf '%s' "$json" | jq -c '[.assets[]? | select(.name | endswith("-setup.exe"))][0] // empty')
            if [ -n "$b" ]; then
              surl=$(printf '%s'  "$b" | jq -r '.browser_download_url')
              ssize=$(printf '%s' "$b" | jq -r '.size')
            fi
          fi
          {
            echo "VITE_RELEASE_TAG=$tag"
            echo "VITE_RELEASE_DATE=$date"
            echo "VITE_RELEASE_URL=$url"
            echo "VITE_RELEASE_SIZE=$size"
            echo "VITE_RELEASE_FILE=$name"
            echo "VITE_RELEASE_SETUP_URL=$surl"
            echo "VITE_RELEASE_SETUP_SIZE=$ssize"
          } >> "$GITHUB_ENV"
          echo "最新 Release：${tag:-（还没有）}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # npm ci 而不是 npm install：严格按 lock 文件装，
      # 保证线上构建和本地是同一套依赖
      - run: npm ci

      # build 里串了 tsc → vite build → SSR 构建 → 预渲染。
      # 预渲染脚本会在渲染结果异常时直接抛错，
      # 所以这一步绿了就代表产物里真的有正文，不是空壳。
      - run: npm run build
        env:
          SITE_URL: https://nudc.github.io/wego-voice/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
