name: 发布版本

# 打 tag 即发布：
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 建 Release 要写权限
  actions: write # 发版后要派发官网部署

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      # tag 与 tauri.conf.json 里的版本号必须一致。
      #
      # 不校验的话会出现「Release 叫 v0.2.0，装完打开显示 0.1.0」——
      # 用户报 bug 时说的版本号是错的，排查直接跑偏。
      - name: 校验 tag 与版本号一致
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=$tag  tauri.conf.json=$conf"
          if [ "$tag" != "$conf" ]; then
            echo "::error::tag ($tag) 与 tauri.conf.json ($conf) 不一致。先改版本号再打 tag。"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # 发版前跑一遍。构建能过不代表行为对，而版本一旦发出去就收不回来了。
      - name: 测试
        run: |
          npx tsc --noEmit
          cargo test --release --workspace

      # 只出免安装单文件，不做安装包（bundle.active = false）。
      # Tauri 的 exe 本身就把前端资源嵌进去了，拷哪儿都能跑。
      - name: 构建
        run: npm run tauri build

      # 把 cargo 的内部二进制名 `wego-voice-app.exe` 改成带版本号的对外名字 ——
      # 用户下载目录里躺着一堆 exe 时，名字是唯一的线索。
      - name: 整理产物并计算校验和
        id: pkg
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp target/release/wego-voice-app.exe "dist/wego-voice_${ver}_x64.exe"
          {
            echo "portable=dist/wego-voice_${ver}_x64.exe"
            echo "portable_name=wego-voice_${ver}_x64.exe"
            echo "portable_sha=$(sha256sum "dist/wego-voice_${ver}_x64.exe" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: 建 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTE'
          ## 这个版本有什么

          - **实时音高校准** —— 端到端实测 29.92 ms（No-Go 线 30 ms），
            按调式量化、保留颤音、跑调过大时不硬拉
          - **实时声线塑形** —— 共振峰平移 + 频谱倾斜 + 整体移调，打包成具名「角色」。
            纯 DSP，不动音高、不增加延迟，不需要下载任何模型
          - **从参考音频生成角色** —— 拖一段 WAV 进来，自动算出该拧多少
          - **干声录制** —— 落盘的是原始干声，不是修正过的声音
          - **诊断页** —— 延迟构成、实时健康度、时钟漂移、输入噪声，都在你自己机器上量

          ## 这个版本没有什么

          - ❌ **基于神经网络的声线转换**（「像某个指定的人」）还在开发。
            现在的声线塑形是纯 DSP，能做出可控的声线，**做不到克隆**。
          - ❌ 伴奏导入、调性自动检测、分轨导出、批量处理
          - ❌ macOS / Linux。低延迟路线是 Windows 特有的（WASAPI 独占）

          ## 已知问题

          - 10 分钟连测在开发机上有 42 次 xrun，归因为**该机器每隔几分钟
            一次约 44 ms 的整机冻结**（两个音频线程同时停顿而 CPU 仅 4%），
            不是本程序算不过来。**尚未在普通台式机上复测。**
          - 往返延迟的脉冲实测尚未完成（缺回环线）。29.92 ms 是
            理论下界 + 分段实测，不含驱动与硬件固有延迟。

          ## 怎么用

          **仅 Windows 10 / 11（x64）。** 下载下面的 `.exe`，放哪儿都行，双击即可。
          **不需要安装** —— 不写注册表、不留卸载项，不想要了直接删文件。

          > ⚠️ **未做代码签名**，Windows SmartScreen 会弹「已保护你的电脑」。
          > 点「更多信息 → 仍要运行」即可。代码签名证书还没买，这一条会一直存在。
          > 不放心的话用下面的 SHA256 自行核对。

          > ⚠️ 需要系统已有 **Microsoft Edge WebView2 运行时**
          > （微软官方免费组件，Windows 11 与较新的 Windows 10 都自带）。
          > 缺失时程序会弹窗说明，不会静默失败。

          配置与角色库存在 `%APPDATA%\com.wego.voice\`，录音存在
          `音乐\wego-voice\` —— **免安装版也一样**，不随 exe 走。

          ## 用之前请确认

          - **戴有线耳机。** 外放会让麦克风拾到自己的输出，形成啸叫回路。
          - **蓝牙耳机做不了实时耳返** —— 编解码本身就有 100~250 ms 延迟，
            是无线协议的物理限制，任何软件都绕不过。
          - 低延迟模式会**独占声卡**，运行期间系统其他声音会静音。

          ## 校验和
          NOTE
          printf '\n```\n%s\n  %s\n```\n' \
            "${{ steps.pkg.outputs.portable_sha }}" "${{ steps.pkg.outputs.portable_name }}" \
            >> notes.md

          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.pkg.outputs.portable }}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md

      # Release 发出去之后刷新官网。
      #
      # 页面里的版本探针已经能自己拿到最新版，所以这一步不再是必需的 ——
      # 但它刷新的是**禁用 JS / API 限流时的兜底值**，不跑的话那条路径
      # 会一直停在旧版本。成本一次构建，留着。
      #
      # ⚠️ 必须**派发到 main**，不能把 pages.yml 当可复用工作流在这里调用。
      # v0.1.0 就栽在这上面：复用调用会继承 tag 的 ref，而 `github-pages`
      # 环境默认只允许默认分支部署，于是被拒：
      #   Tag "v0.1.0" is not allowed to deploy to github-pages
      #   due to environment protection rules.
      # 派发一次跑在 main 的上下文里，规则自然满足。
      - name: 刷新官网
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
