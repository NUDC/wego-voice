name: 发布版本

# 打 tag 即发布：
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 建 Release 要写权限

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      # tag 与 tauri.conf.json 里的版本号必须一致。
      #
      # 不校验的话会出现「Release 叫 v0.2.0，装完打开显示 0.1.0」——
      # 用户报 bug 时说的版本号是错的，排查直接跑偏。
      - name: 校验 tag 与版本号一致
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=$tag  tauri.conf.json=$conf"
          if [ "$tag" != "$conf" ]; then
            echo "::error::tag ($tag) 与 tauri.conf.json ($conf) 不一致。先改版本号再打 tag。"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # 发版前跑一遍。构建能过不代表行为对，而版本一旦发出去就收不回来了。
      - name: 测试
        run: |
          npx tsc --noEmit
          cargo test --release --workspace

      - name: 构建安装包
        run: npm run tauri build

      # SHA256 让用户能自己核对下载到的文件。
      # 安装包**没有代码签名**，SmartScreen 会拦 —— 校验和是目前唯一的自证手段。
      - name: 计算校验和
        id: pkg
        shell: bash
        run: |
          exe=$(ls target/release/bundle/nsis/*-setup.exe | head -1)
          sha=$(sha256sum "$exe" | cut -d' ' -f1)
          echo "path=$exe" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$exe")" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: 建 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTE'
          ## 这个版本有什么

          - **实时音高校准** —— 端到端实测 29.92 ms（No-Go 线 30 ms），
            按调式量化、保留颤音、跑调过大时不硬拉
          - **实时声线塑形** —— 共振峰平移 + 频谱倾斜 + 整体移调，打包成具名「角色」。
            纯 DSP，不动音高、不增加延迟，不需要下载任何模型
          - **从参考音频生成角色** —— 拖一段 WAV 进来，自动算出该拧多少
          - **干声录制** —— 落盘的是原始干声，不是修正过的声音
          - **诊断页** —— 延迟构成、实时健康度、时钟漂移、输入噪声，都在你自己机器上量

          ## 这个版本没有什么

          - ❌ **基于神经网络的声线转换**（「像某个指定的人」）还在开发。
            现在的声线塑形是纯 DSP，能做出可控的声线，**做不到克隆**。
          - ❌ 伴奏导入、调性自动检测、分轨导出、批量处理
          - ❌ macOS / Linux。低延迟路线是 Windows 特有的（WASAPI 独占）

          ## 已知问题

          - 10 分钟连测在开发机上有 42 次 xrun，归因为**该机器每隔几分钟
            一次约 44 ms 的整机冻结**（两个音频线程同时停顿而 CPU 仅 4%），
            不是本程序算不过来。**尚未在普通台式机上复测。**
          - 往返延迟的脉冲实测尚未完成（缺回环线）。29.92 ms 是
            理论下界 + 分段实测，不含驱动与硬件固有延迟。

          ## 安装

          下载下面的 `.exe` 双击安装。**仅 Windows 10 / 11。**

          > ⚠️ **安装包未做代码签名**，Windows SmartScreen 会弹「已保护你的电脑」。
          > 点「更多信息 → 仍要运行」即可。代码签名证书还没买，这一条会一直存在。
          > 不放心的话用下面的 SHA256 自行核对。

          ## 用之前请确认

          - **戴有线耳机。** 外放会让麦克风拾到自己的输出，形成啸叫回路。
          - **蓝牙耳机做不了实时耳返** —— 编解码本身就有 100~250 ms 延迟，
            是无线协议的物理限制，任何软件都绕不过。
          - 低延迟模式会**独占声卡**，运行期间系统其他声音会静音。

          ## 校验和
          NOTE
          printf '\n```\nSHA256  %s\n  %s\n```\n' \
            "${{ steps.pkg.outputs.sha }}" "${{ steps.pkg.outputs.name }}" >> notes.md

          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.pkg.outputs.path }}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md

  # Release 发出去之后重新部署官网，把版本号与下载链接刷新上去。
  # 官网是零 JS 的静态页，版本信息是**构建期**烤进 HTML 的。
  site:
    needs: release
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
