<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>wego-voice — 一开口就是准的，还能换一把嗓子</title>
    <meta
      name="description"
      content="唱的当下就在耳返里听到修准的自己，声线也能当场换。Windows 免安装单文件，实测端到端延迟 29.92 毫秒，声音不出本机。"
    />

    <!-- 浏览器 UI 跟着站点配色走，移动端地址栏才不会突兀地留一条白边 -->
    <meta name="theme-color" content="#0b0c10" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

    <!-- 社交卡片。canonical 与 og:url 由 scripts/prerender.mjs 注入
         （它们需要绝对地址，而 base 是相对的）。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="wego-voice" />
    <meta property="og:locale" content="zh_CN" />
    <meta
      property="og:title"
      content="wego-voice — 一开口就是准的，还能换一把嗓子"
    />
    <meta
      property="og:description"
      content="实时修音直接进耳返，实测端到端 29.92 毫秒。Windows 免安装单文件，声音不出本机。"
    />
    <meta name="twitter:card" content="summary" />

    <!-- 结构化数据：让搜索结果里能直接显示"平台 / 类别"，而不是只有一段摘要。
         刻意不写版本号与下载链接 —— 那些随发版变化，而这个文件是静态的，
         写进来迟早会和实际版本对不上。版本信息在正文里，由构建期烤一份兜底、
         页面加载后再由版本探针改写成最新的。 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "wego-voice",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Windows 10, Windows 11",
        "description": "桌面实时修音与声线塑形工具。唱的当下就在耳返里听到修准的自己，声线也能当场换。端到端延迟实测 29.92 毫秒，全程单机运行，声音不出本机。",
        "inLanguage": "zh-CN"
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
