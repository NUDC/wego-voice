[package]
name = "wego-voice-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "wego-voice 桌面工具（Tauri 外壳）"

[lib]
# Tauri 2 的约定：核心逻辑放 lib，main.rs 只是入口。
# 这样 `--bench` 这类无界面入口也能复用同一套代码。
name = "wego_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
voice-audio.workspace = true
# 只用默认特性：资产管理（模型在哪、够不够、对不对）。
# 推理引擎一律不进主程序 —— 那些在伴生程序里。
voice-neural = { path = "../crates/voice-neural" }
voice-core.workspace = true
# tray-icon：系统托盘。它在这个产品里不是装饰 ——
# 独占模式会占着声卡，托盘是让这件事一直可见的唯一办法（见 src/tray.rs）。
# protocol-asset：录音页要在窗口里直接播放录音（`convertFileSrc`）。
# 作用域锁死在 `$AUDIO/wego-voice/*`，见 tauri.conf.json —— 开这个特性
# 等于把本地文件暴露给 WebView，范围必须限死在我们自己写出去的那个目录。
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
clap.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json = "1"
anyhow.workspace = true
