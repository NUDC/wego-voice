[package]
name = "voice-neural"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# ⚠️ `ort`（ONNX Runtime）是**可选**的，默认关闭。
#
# 两个理由：
#
# 1. 打开它会把 ONNX Runtime 链进来，而主程序的卖点是 6.5 MB 免安装单文件。
#    神经声线转换是**按需下载**的功能，不该让不用它的人付这个体积。
# 2. 发版流水线跑 `cargo test --release --workspace`。把几十 MB 的
#    运行时拖进每一次发版构建，只为编译一个还没接进产品的 crate，不划算。
#
# 开发时用：cargo build -p voice-neural --features onnx
[features]
default = []
onnx = ["dep:ort"]

# 用 tract（纯 Rust 推理引擎）顶替 ONNX Runtime。
# `alternative-backend` 让 ort 不去链接微软的实现，改用我们注入的 C API。
# 调用代码一行不改 —— 只是启动时换一句初始化。
tract = ["onnx", "dep:ort-tract", "ort/alternative-backend"]

# 解码器网络。用 candle 而不是 ort，因为它要**训练** —— ort 没有梯度。
# 推理与训练共用同一份实现，避免"同一个模型写两遍"。
candle = ["dep:candle-core", "dep:candle-nn"]

[dependencies]
anyhow.workspace = true
voice-core = { path = "../voice-core" }

# `load-dynamic`：**运行时**加载 onnxruntime.dll，不在构建期链进来。
#
# 两个好处，都关系到产品形态：
# 1. 主程序体积不变。DLL（15.7 MB）随模型一起按需下载，不用它的人不付
# 2. 构建期不下载、不链接大二进制 —— 发版流水线不受影响
#
# 代价是启动时要显式告诉它 DLL 在哪，见 `session::init`。
ort = { version = "2.0.0-rc.10", default-features = false, features = ["load-dynamic"], optional = true }
ort-tract = { version = "0.4", optional = true }
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }

[[bin]]
name = "wego-neural"
required-features = ["onnx"]
