[workspace]
resolver = "2"
members = ["crates/voice-core", "crates/voice-audio", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"

[workspace.dependencies]
voice-core = { path = "crates/voice-core" }
voice-audio = { path = "crates/voice-audio" }

cpal = "0.18"
rtrb = "0.4.0"
audio_thread_priority = "0.38.0"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }

# Release 构建必须开优化：DSP 在 debug 下慢一个数量级，
# 用 debug 构建测出来的延迟数字没有参考价值。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
